name: Validate files
on:  push
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: get-repo-code
        uses: actions/checkout@v5

      - name: Validate files
        run: |
          echo "Validating files..."
          test -f index.html

      - name: Validate js files
        run: |
          echo "Validating files..."
          test -f script.js

      - name: Validate js code
        run: |
          echo "Validating code..."
          node --check script.js
