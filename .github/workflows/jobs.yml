name: Jobs Test
# on:  push
# on: workflow_dispatch
on:
  workflow_run:
    workflows: [First Workflow]
    types:
      - completed
jobs:
  validate-html:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: get-repo-code
        uses: actions/checkout@v5

      - name: Validate files
        run: |
          echo "Validating files..."
          test -f index.html
  
  validate-js:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: get-repo-code
        uses: actions/checkout@v5
     
      - name: Validate js files
        run: |
          echo "Validating files..."
          test -f script.js

  validate-code:
    needs: [validate-html, validate-js]
    runs-on: ubuntu-latest
    steps:
      - name: get-repo-code
        uses: actions/checkout@v5
     
      - name: Validate js code
        run: |
          echo "Validating code..."
          node --check script.js
      
      - name: Validate html code
        run: npx htmlhint index.html
